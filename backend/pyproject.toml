[project]
name = "contour-backend"
version = "0.1.0"
description = "ProjectContour backend: pipeline and API for generating printable terrain models"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "shapely>=2.0.6",
    "pymap3d>=3.2.0",
    "trimesh>=4.5.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "gpxpy>=1.6.2",
    "mapbox-vector-tile>=2.1.0",
    "triangle>=20230923",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "responses>=0.25.0",
]

[project.scripts]
contour-serve = "contour.api.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contour"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
